type Domain @entity(immutable: false) {
  "The namehash of the name"
  id: ID!
  "The human readable name, if known. Unknown portions replaced with hash in square brackets (eg, foo.[1234].eth)"
  name: String
  "The human readable label name (imported from CSV), if known"
  labelName: String
  "keccak256(labelName)"
  labelhash: Bytes
  "The namehash (id) of the parent name"
  parent: Domain
  "Can count domains from length of array"
  subdomains: [Domain!]! @derivedFrom(field: "parent")
  "The number of subdomains"
  subdomainCount: Int!
  "Address logged from current resolver, if any"
  resolvedAddress: Account

  "The resolver that controls the domain's settings"
  resolver: Resolver
  "The time-to-live (TTL) value of the domain's records"
  ttl: BigInt

  "Indicates whether the domain has been migrated to a new registrar"
  isMigrated: Boolean!
  "The time when the domain was created"
  createdAt: BigInt!

  "The account that owns the domain"
  owner: Account!
  "The account that owns the ERC721 NFT for the domain"
  registrant: Account
  "The account that owns the wrapped domain"
  wrappedOwner: Account
  "The name's current token in its ENSv2 registry (id = registry address ++ uint256 token id); null for a name not live in ENSv2"
  registryToken: ENSv2Token

  "The expiry date for the domain, from either the registration, or the wrapped domain if PCC is burned"
  expiryDate: BigInt

  "The registration associated with the domain"
  registration: Registration @derivedFrom(field: "domain")
  "The wrapped domain associated with the domain"
  wrappedDomain: WrappedDomain @derivedFrom(field: "domain")

  "The events associated with the domain"
  events: [DomainEvent!]! @derivedFrom(field: "domain")

  "Is domain stored offchain (Blockscout/BENS extension)"
  storedOffchain: Boolean!
  "Is domain resolved with wildcard (Blockscout/BENS extension)"
  resolvedWithWildcard: Boolean!

  "Token ID for the domain (ERC721) (Blockscout/BENS extension)"
  tokenId: BigInt
}

