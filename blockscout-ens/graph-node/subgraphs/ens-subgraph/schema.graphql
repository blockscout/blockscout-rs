  namespace: ENSv2Namespace!
  parent: ENSv2NamePath
  label: String
  labelhash: Bytes!
  name: String
  namehash: Bytes!
  depth: Int!
  domain: Domain # compatibility projection; nullable for late-linked and root paths
  active: Boolean!
  namespaceCount: Int! # needed to enumerate ENSv2PathNamespaceIndex
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Namespace @entity(immutable: false) {
  id: Bytes! # registry + baseNamehash
  registry: ENSv2Registry! # registry serving this namespace
  parentPath: ENSv2NamePath # e.g. base.eth for the registry serving *.base.eth
  parentSlot: ENSv2NameSlot
  parentRegistry: ENSv2Registry
  parentSlotId: BigInt
  parentTokenId: BigInt
  parentResource: BigInt
  baseName: String
  baseNamehash: Bytes!
  active: Boolean!
  pathCount: Int! # used to enumerate ENSv2NamespacePathIndex
  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
  transactionID: Bytes
  logIndex: BigInt
}

type ENSv2NamespaceLink @entity(immutable: false) {
