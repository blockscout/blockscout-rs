}

type ContractOwnership @entity(immutable: false) {
  id: Bytes! # contract address
  contract: Bytes!
  owner: Account!
  updatedAtBlock: BigInt!
}

type RegistrarController @entity(immutable: false) {
  id: Bytes! # contract-controller
  contract: Bytes!
  controller: Bytes!
  active: Boolean!
  updatedAtBlock: BigInt!
}
