# ---------------------------------------------------------------------------
# ENSv2 native and compatibility entities.
# ENSv2-native entities are the source of truth for registries, namespaces,
# slots, tokens, resources, and linked paths. Domain (above) and eligible
# ENSv2NamePath rows are bounded compatibility projections and do not backfill
# registrations that predate a namespace link. RootRegistry paths are
# materialized natively but remain unprojected because root-label namehashes
# can collide with existing ENSv1 TLD Domain rows.
# ---------------------------------------------------------------------------

enum ENSv2RegistryKind {
  ROOT
  ETH
  USER
  WRAPPER
  REVERSE
  UNKNOWN
}

enum ENSv2NameSlotStatus {
  AVAILABLE
  RESERVED
  REGISTERED
}

type ENSv2Registry @entity(immutable: false) {
  id: Bytes! # registry address
  address: Bytes!
  # The implementation the proxy runs: set from ProxyDeployed, then followed
  # through ERC1967 Upgraded. Classifies `kind` (on discovery) and selects
  # implementation-specific behaviour such as unregister clearing.
  implementation: Bytes
  kind: ENSv2RegistryKind!
  canonicalParentRegistry: ENSv2Registry
  canonicalParentLabel: String
  namespaces: [ENSv2Namespace!]! @derivedFrom(field: "registry")
  namespaceCount: Int!
  # The namespaces this registry's names currently have ENSv2NamePath (and
  # Domain) rows under: its canonical namespace, plus at most 8 aliases, and
  # never more than 16 in total (ensv2Paths.ts). Every registration writes one
  # path per entry, so the list is what bounds the cost of a registration.
  materializedNamespaces: [ENSv2Namespace!]!
  # How many times the registry's names have been projected under a canonical
  # namespace and under an alias, over its whole life: first links, and every
  # time a link (its own, or one further up the tree) was removed and made
  # again. Each pool stops at 32, after which further links of that kind are
  # recorded but not projected. This is what stops a link being toggled to
  # redo a whole registry's projection for one cheap event. The two pools are
  # separate so that linking a registry under other names cannot use up the
  # allowance of its own name. Not counted for the RootRegistry and
  # ETHRegistry, which are never backfilled.
  canonicalMaterializations: Int!
  aliasMaterializations: Int!
  # True once the registry's own events are indexed: it is the RootRegistry
  # or ETHRegistry, it was deployed through VerifiableFactory, or it has
  # emitted LabelRegistered, LabelReserved or ParentUpdated. False for an
  # address that a name merely points at, or that a registry names as its
  # parent, and that has emitted nothing itself.
  indexed: Boolean!
  # Number of ENSv2RegistrySlotIndex rows: every slot this registry has ever
  # had, so a namespace linked after its names were registered can project them.
  slotCount: Int!
  discoveredAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
  # Registry-level token metadata URI template and renderer.
  # Current-state only, like the sibling resolver/subregistry fields on
  # ENSv2NameSlot — URIUpdated's own history isn't otherwise meaningful.
  uri: String
  uriRenderer: Bytes
}
# Two other PermissionedRegistry events are intentionally unwired:
# RegistryCreated() fires from the same constructor path that
# ProxyDeployed/bootstrapRegistry already use to create this row, so it adds
# no information; URI(string,uint256) is part of the standard ERC1155
# interface this contract implements but is never actually emitted anywhere
# in its own source (confirmed on-chain: zero occurrences from RootRegistry
# or ETHRegistry directly — the nonzero network-wide topic0 count is
# collisions with unrelated ERC1155 contracts on the same chain, since
# URI(string,uint256) is a very common signature).

# HCA (Hierarchical Context Authority) proxies are deployed through the same
# VerifiableFactory this subgraph already indexes for ENSv2Registry proxies
# — StandaloneHCAFactory shares that instance rather than deploying its own
# — so an HCA deployment fires the identical ProxyDeployed event a registry
# deployment does. Recorded separately here rather than folded into
# ENSv2Registry: an HCA isn't a registry (no namespaces/subdomains under
# it), so giving it a Registry row — even tagged UNKNOWN — would be wrong,
# not just imprecise. An HCA is an optional per-wallet ENS execution account,
# not the wallet's identity.
type ENSv2HCA @entity(immutable: false) {
  id: Bytes! # HCA proxy address
  implementation: Bytes!
  # ProxyDeployed's own `sender` param — the caller of
  # StandaloneHCAFactory.deploy(...), not necessarily the HCA's eventual
  # owner (the real owner is an argument to that call, not surfaced on the
  # ProxyDeployed event itself).
  deployer: Bytes!
  discoveredAt: BigInt!
  createdAtBlock: BigInt!
}

# ENSIP-19 "default" (chain-agnostic) primary name, set via
# DefaultReverseRegistrar.setName()/setNameForAddr()/setNameForAddrWithSignature()
# — a flat address -> name mapping (contracts-v2's
# lib/ens-contracts/contracts/reverseRegistrar/StandaloneReverseRegistrar.sol
# ::_names), entirely separate from the legacy node-keyed addr.reverse scheme
# the existing v1 ENSRegistry/Resolver sources already pick up generically
# (NewResolver/NameChanged on any node, including addr.reverse subnodes).
# Deliberately NOT named ENSv2ReverseRecord/PrimaryName-generic: this entity
# is specifically the ENSIP-19 "default" reverse record, not a general
# reverse-resolution model — a coin-type-specific (non-default) reverse
# record would be a different mechanism/contract entirely, out of scope here.
type ENSv2PrimaryName @entity(immutable: false) {
  id: Bytes! # the address itself
  account: Account!
  # Null exactly when the last NameForAddrChanged carried an empty string —
  # the contract's own clearing convention (StandaloneReverseRegistrar has no
  # separate "cleared" event), matching this schema's established pattern for
  # other entities where an empty/zero value is the clear signal.
  name: String
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  "Blockscout/BENS extension: namehash of <address>.addr.reverse, so the legacy reverse-name lookup (keyed by that node) can join this record without keccak in SQL"
  reverseNode: Bytes
}

type ENSv2NameSlot @entity(immutable: false) {
  id: Bytes! # registry-address + slotId
  registry: ENSv2Registry!
  slotId: BigInt!
  labelhash: Bytes!
  label: String
  currentResource: ENSv2Resource # null while AVAILABLE
  currentToken: ENSv2Token # null while AVAILABLE
  owner: Account # active native owner; null while AVAILABLE
  registrant: Account # active native registrant; null while AVAILABLE
  resolverAddress: Bytes # denormalised convenience copy of resolver's address; null exactly when resolver is null
  resolver: ENSv2Resolver
  subregistryAddress: Bytes # denormalised convenience copy of subregistry's address; null exactly when subregistry is null
  subregistry: ENSv2Registry
  status: ENSv2NameSlotStatus!
  expiryDate: BigInt
  pathCount: Int! # paths bound to the slot; the length of its ENSv2SlotPathIndex list
  registryIndex: Int! # the slot's position in its registry's ENSv2RegistrySlotIndex
  migratedFromV1: Boolean! # true if the current registration's sender was a migration controller
  resources: [ENSv2Resource!]! @derivedFrom(field: "slot")
  paths: [ENSv2NamePath!]! @derivedFrom(field: "slot")
  events: [ENSv2NameSlotEvent!]! @derivedFrom(field: "slot")
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Resource @entity(immutable: false) {
  id: Bytes! # registry-address + resource
  registry: ENSv2Registry!
  slot: ENSv2NameSlot!
  resource: BigInt!
  currentToken: ENSv2Token
  active: Boolean!
  createdAt: BigInt!
  endedAt: BigInt
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Token @entity(immutable: false) {
  id: Bytes! # registry-address + tokenId
  registry: ENSv2Registry!
  slot: ENSv2NameSlot
  resource: BigInt
  resourceEntity: ENSv2Resource
  tokenId: BigInt!
  owner: Account
  active: Boolean!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2NamePath @entity(immutable: false) {
  id: Bytes! # namehash hex
  slot: ENSv2NameSlot!
  registry: ENSv2Registry! # registry that owns this label slot
  namespace: ENSv2Namespace!
  parent: ENSv2NamePath
  label: String
  labelhash: Bytes!
  name: String
  namehash: Bytes!
  depth: Int!
  domain: Domain # compatibility projection; nullable for late-linked and root paths
  active: Boolean!
  namespaceCount: Int! # needed to enumerate ENSv2PathNamespaceIndex
  # Position in its namespace's ENSv2NamespacePathIndex list while the path
  # is active, -1 otherwise.
  namespaceIndex: Int!
  # Position in its slot's ENSv2SlotPathIndex list.
  slotIndex: Int!
  # The namespace currently linked below this name, if any. A name has one
  # subregistry at a time, so there is at most one, and retiring the name
  # follows this instead of scanning every namespace it ever had.
  activeNamespace: ENSv2Namespace
  # True once the ENSv1 names below this name stopped resolving through
  # ENSv1 for good. ENSv2 resolves a name from its registries, so once a name
  # is registered in ENSv2 the ENSv1 names below it are answered by its
  # ENSv2 resolver or not at all. Their Domain rows, at every depth, were
  # cleared of resolver and resolved address at that point, and ENSv1
  # NewResolver events for them are recorded as history only from then on.
  # Set when the name is first projected, when it is retired, and when a
  # subregistry linked under it could not be projected. Never reset: a name
  # below shows an address again only when ENSv2 projects it.
  # False on a name migrated from a locked ENSv1 NameWrapper name: its
  # WrapperRegistry still sends emancipated subnames that have not migrated
  # to ENSv1, so those keep their ENSv1 rows; every other ENSv1 name below
  # was cleared all the same.
  legacySubtreeVoided: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Namespace @entity(immutable: false) {
  id: Bytes! # registry + baseNamehash
  registry: ENSv2Registry! # registry serving this namespace
  parentPath: ENSv2NamePath # e.g. base.eth for the registry serving *.base.eth
  parentSlot: ENSv2NameSlot
  parentRegistry: ENSv2Registry
  parentSlotId: BigInt
  parentTokenId: BigInt
  parentResource: BigInt
  baseName: String
  baseNamehash: Bytes!
  active: Boolean!
  # True while the registry's names are projected under this namespace: they
  # get ENSv2NamePath (and Domain) rows as they are registered, and the names
  # registered before the link are being, or have been, projected (see
  # `backfilled`). An active namespace with `materialized: false` is linked
  # on chain but not projected: the registry already had its 8 alias
  # namespaces, it sits more than 16 registries below the link that changed,
  # or the registry has used up its lifetime projections of that kind
  # (ENSv2Registry.canonicalMaterializations / aliasMaterializations).
  # Emitting the link again (setSubregistry with the same address) retries.
  materialized: Boolean!
  # True once every name the registry had when the namespace was linked has
  # been projected under it. One event projects at most 10,000 names, so a
  # larger registry is projected over the ENSv2 registry events that follow
  # (any registry's), 10,000 names per event, and `backfilled` is false until
  # the last of them. It is also false, and stays false, while names are left
  # out because a name above already has 100,000 names below it
  # (ENSv2SubtreeSize); emitting the link again retries those. While it is
  # false, a name of the registry may have no ENSv2NamePath or Domain yet.
  backfilled: Boolean!
  # How many of the registry's slots (ENSv2RegistrySlotIndex positions) have
  # been looked at for this namespace; where the projection resumes.
  backfillCursor: Int!
  # Bookkeeping: true while the namespace waits in the ENSv2BackfillQueue.
  backfillQueued: Boolean!
  # True when the parent name is the one the registry declares as its parent
  # (ParentUpdated) and that name is itself reached through a canonical
  # namespace. A canonical namespace is materialised ahead of aliases, so
  # linking someone else's registry under other names cannot crowd it out.
  # Evaluated when the namespace is linked, when its registry's parent
  # declaration changes, and when a namespace above it becomes canonical or
  # stops being so (for the first 100,000 names below that declaration).
  canonical: Boolean!
  pathCount: Int! # active paths under the namespace; the length of its ENSv2NamespacePathIndex list
  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
  transactionID: Bytes
  logIndex: BigInt
}

type ENSv2NamespaceLink @entity(immutable: false) {
  id: Bytes! # parent registry + parent slot + child address
  parentRegistry: ENSv2Registry!
  parentSlot: ENSv2NameSlot
  parentSlotId: BigInt!
  parentTokenId: BigInt
  parentResource: BigInt
  childRegistryAddress: Bytes!
  childRegistry: ENSv2Registry
  active: Boolean!
  transactionID: Bytes!
  blockNumber: BigInt!
  logIndex: BigInt!
}

type ENSv2Resolver @entity(immutable: false) {
  id: Bytes! # resolver address
  address: Bytes!
  # True once the address has emitted PermissionedResolver (recordId-keyed)
  # events. Such a resolver answers for a node without its own record from
  # its default record (the record linked to the root node).
  recordBased: Boolean!
  # Number of ENSv2ResolverAttachmentIndex rows: names ever pointed at this
  # (record-based) resolver, so a default-record change can reach them.
  attachmentCount: Int!
  # True once this resolver has names whose records are not projected to the
  # legacy side: one event refreshes at most 100 names (the first 100 linked
  # to a record, and the first 100 pointed at the resolver for its default
  # record; ensv2ResolverProjection.ts). A name beyond that is never given a
  # record snapshot, so its legacy Resolver and Domain.resolvedAddress are
  # empty rather than out of date. The ENSv2Resolver* entities are always
  # complete.
  legacyProjectionTruncated: Boolean!
  slots: [ENSv2NameSlot!]! @derivedFrom(field: "resolver")
  # PermissionedResolver's recordId-keyed model — see ENSv2ResolverRecord below.
  records: [ENSv2ResolverRecord!]! @derivedFrom(field: "resolver")
  links: [ENSv2ResolverLink!]! @derivedFrom(field: "resolver")
}

type ENSv2ResolverAttachment @entity(immutable: true) {
  id: Bytes! # resolver + node
  resolver: ENSv2Resolver!
  node: Bytes!
  # Position among the names ever pointed at the resolver. Only the first 100
  # follow the resolver's default record (ensv2ResolverProjection.ts).
  index: Int!
}

type ENSv2ResolverAttachmentIndex @entity(immutable: true) {
  id: Bytes! # resolver + index
  resolver: ENSv2Resolver!
  index: Int!
  attachment: ENSv2ResolverAttachment!
}

type ENSv2RoleAssignment @entity(immutable: false) {
  id: Bytes! # contract-address + resource + account
  contract: Bytes!
  resource: BigInt!
  resourceEntity: ENSv2Resource
  resourceArgument: ENSv2ResolverResourceArgument
  account: Account!
  roleBitmap: BigInt!
  updatedAtBlock: BigInt!
}

# Argument bytes used to derive an argument-scoped PermissionedResolver role
# resource. ResourceArgument is emitted once before the first role grant for
# that resource; this row retains the latest observed metadata.
type ENSv2ResolverResourceArgument @entity(immutable: false) {
  id: Bytes! # resolver + resource
  resolver: ENSv2Resolver!
  resource: BigInt!
  arg: Bytes!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2RoleChange @entity(immutable: true) {
  id: Bytes!
  contract: Bytes!
  resource: BigInt!
  account: Account!
  oldRoleBitmap: BigInt!
  newRoleBitmap: BigInt!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

interface ENSv2NameSlotEvent {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2LabelRegistered implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes! # transactionID-logIndex
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  owner: Account!
  expiryDate: BigInt!
  isReRegistration: Boolean!
  sender: Bytes! # event.params.sender, the actual caller of register()
  isV1Migration: Boolean! # true if sender matches a known migration controller address
}

type ENSv2LabelRenewed implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  newExpiryDate: BigInt!
}

type ENSv2LabelUnregistered implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  sender: Bytes!
}

type ENSv2TokenTransferred implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  from: Account!
  to: Account!
  tokenId: BigInt!
}

type ENSv2TokenRegenerated implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  oldTokenId: BigInt!
  newTokenId: BigInt!
}

type ENSv2ResolverUpdate implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  resolverAddress: Bytes # null means setResolver(..., address(0))
  sender: Bytes!
}

type ENSv2SubregistryUpdate implements ENSv2NameSlotEvent
  @entity(immutable: true) {
  id: Bytes!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  subregistryAddress: Bytes # null means setSubregistry(..., address(0))
  sender: Bytes!
