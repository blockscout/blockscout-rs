# ---------------------------------------------------------------------------
# ENSv2 native and compatibility entities.
# ENSv2-native entities are the source of truth for registries, namespaces,
# slots, tokens, resources, and linked paths. Domain (above) and eligible
# ENSv2NamePath rows are bounded compatibility projections and do not backfill
# registrations that predate a namespace link. RootRegistry paths are
# materialized natively but remain unprojected because root-label namehashes
# can collide with existing ENSv1 TLD Domain rows.
# ---------------------------------------------------------------------------

enum ENSv2RegistryKind {
  ROOT
  ETH
  USER
  WRAPPER
  REVERSE
  UNKNOWN
}

enum ENSv2NameSlotStatus {
  AVAILABLE
  RESERVED
  REGISTERED
}

type ENSv2Registry @entity(immutable: false) {
  id: Bytes! # registry address
  address: Bytes!
  # Used to classify `kind` via a known implementation-address mapping.
  implementation: Bytes
  kind: ENSv2RegistryKind!
  canonicalParentRegistry: ENSv2Registry
  canonicalParentLabel: String
  namespaces: [ENSv2Namespace!]! @derivedFrom(field: "registry")
  namespaceCount: Int!
  discoveredAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
  # Registry-level token metadata URI template and renderer.
  # Current-state only, like the sibling resolver/subregistry fields on
  # ENSv2NameSlot — URIUpdated's own history isn't otherwise meaningful.
  uri: String
  uriRenderer: Bytes
}
# Two other PermissionedRegistry events are intentionally unwired:
# RegistryCreated() fires from the same constructor path that
# ProxyDeployed/bootstrapRegistry already use to create this row, so it adds
# no information; URI(string,uint256) is part of the standard ERC1155
# interface this contract implements but is never actually emitted anywhere
# in its own source (confirmed on-chain: zero occurrences from RootRegistry
# or ETHRegistry directly — the nonzero network-wide topic0 count is
# collisions with unrelated ERC1155 contracts on the same chain, since
# URI(string,uint256) is a very common signature).

# HCA (Hierarchical Context Authority) proxies are deployed through the same
# VerifiableFactory this subgraph already indexes for ENSv2Registry proxies
# — StandaloneHCAFactory shares that instance rather than deploying its own
# — so an HCA deployment fires the identical ProxyDeployed event a registry
# deployment does. Recorded separately here rather than folded into
# ENSv2Registry: an HCA isn't a registry (no namespaces/subdomains under
# it), so giving it a Registry row — even tagged UNKNOWN — would be wrong,
# not just imprecise. An HCA is an optional per-wallet ENS execution account,
# not the wallet's identity.
type ENSv2HCA @entity(immutable: false) {
  id: Bytes! # HCA proxy address
  implementation: Bytes!
  # ProxyDeployed's own `sender` param — the caller of
  # StandaloneHCAFactory.deploy(...), not necessarily the HCA's eventual
  # owner (the real owner is an argument to that call, not surfaced on the
  # ProxyDeployed event itself).
  deployer: Bytes!
  discoveredAt: BigInt!
  createdAtBlock: BigInt!
}

# ENSIP-19 "default" (chain-agnostic) primary name, set via
# DefaultReverseRegistrar.setName()/setNameForAddr()/setNameForAddrWithSignature()
# — a flat address -> name mapping (contracts-v2's
# lib/ens-contracts/contracts/reverseRegistrar/StandaloneReverseRegistrar.sol
# ::_names), entirely separate from the legacy node-keyed addr.reverse scheme
# the existing v1 ENSRegistry/Resolver sources already pick up generically
# (NewResolver/NameChanged on any node, including addr.reverse subnodes).
# Deliberately NOT named ENSv2ReverseRecord/PrimaryName-generic: this entity
# is specifically the ENSIP-19 "default" reverse record, not a general
# reverse-resolution model — a coin-type-specific (non-default) reverse
# record would be a different mechanism/contract entirely, out of scope here.
type ENSv2PrimaryName @entity(immutable: false) {
  id: Bytes! # the address itself
  account: Account!
  # Null exactly when the last NameForAddrChanged carried an empty string —
  # the contract's own clearing convention (StandaloneReverseRegistrar has no
  # separate "cleared" event), matching this schema's established pattern for
  # other entities where an empty/zero value is the clear signal.
  name: String
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  "Blockscout/BENS extension: namehash of <address>.addr.reverse, so the legacy reverse-name lookup (keyed by that node) can join this record without keccak in SQL"
  reverseNode: Bytes
}

type ENSv2NameSlot @entity(immutable: false) {
  id: Bytes! # registry-address + slotId
  registry: ENSv2Registry!
  slotId: BigInt!
  labelhash: Bytes!
  label: String
  currentResource: ENSv2Resource # null while AVAILABLE
  currentToken: ENSv2Token # null while AVAILABLE
  owner: Account # active native owner; null while AVAILABLE
  registrant: Account # active native registrant; null while AVAILABLE
  resolverAddress: Bytes # denormalised convenience copy of resolver's address; null exactly when resolver is null
  resolver: ENSv2Resolver
  subregistryAddress: Bytes # denormalised convenience copy of subregistry's address; null exactly when subregistry is null
  subregistry: ENSv2Registry
  status: ENSv2NameSlotStatus!
  expiryDate: BigInt
  pathCount: Int!
  migratedFromV1: Boolean! # true if the current registration's sender was a migration controller
  resources: [ENSv2Resource!]! @derivedFrom(field: "slot")
  paths: [ENSv2NamePath!]! @derivedFrom(field: "slot")
  events: [ENSv2NameSlotEvent!]! @derivedFrom(field: "slot")
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Resource @entity(immutable: false) {
  id: Bytes! # registry-address + resource
  registry: ENSv2Registry!
  slot: ENSv2NameSlot!
  resource: BigInt!
  currentToken: ENSv2Token
  active: Boolean!
  createdAt: BigInt!
  endedAt: BigInt
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Token @entity(immutable: false) {
