type ENSv2Registration @entity(immutable: false) {
  id: Bytes! # registry address + slotId; same scheme as ENSv2NameSlot.id
  slot: ENSv2NameSlot!
  resource: ENSv2Resource
  path: ENSv2NamePath
  label: String
  # owner/duration/paymentToken/referrer/base/premium are all unconditionally
  # set from non-optional NameRegistered event params on every creation
  # path in handleNameRegistered — tightened from nullable to match that
  # actual event data.
  owner: Account!
  duration: BigInt!
  paymentToken: Bytes!
  referrer: Bytes!
  base: BigInt!
  premium: BigInt!
  registrationDate: BigInt!
  # Always set from the registration event on creation.
  expiryDate: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

# PublicResolverV2's generic node-keyed DataChanged profile. It is indexed by
# the existing addressless classic Resolver source, not PermissionedResolver.
type ENSv2ResolverData @entity(immutable: false) {
  id: Bytes! # resolver + node + key
  resolver: ENSv2Resolver!
  node: Bytes!
  key: String!
  # No `value` field: DataChanged's real signature only logs the data's
  # keccak256 hash as an indexed topic (indexedData), never the raw bytes —
  # no code path could ever populate one (see src/resolver.ts::handleDataChanged).
  # The raw value cannot be recovered from this event.
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

# --- Deployed recordId-keyed PermissionedResolver event model ---
# A recordId is an opaque integer, minted once per resolver instance
# (contracts-v2's _recordCount/_recordIds are per-contract storage — a
# recordId is only unique WITHIN one resolver, never globally, hence every
# id below being resolver-prefixed). The first setter call for a
# previously-unlinked DNS name allocates a fresh recordId and emits
# Linked(recordId, node, name); every later setter call on an
# already-linked name fires only its own *Updated(recordId, ...) event — no
# node/name, Linked isn't re-emitted. Multiple names can share one recordId
# via explicit linkToNode/linkToRecord. linkToRecord(name, 0) is a real,
# valid "explicitly unlink" call — recordId == 0 is reachable on Linked,
# never on any *Updated event (setters always resolve to recordId >= 1).

type ENSv2ResolverRecord @entity(immutable: false) {
  id: Bytes! # resolver + recordId
  resolver: ENSv2Resolver!
  recordId: BigInt!
  contenthash: Bytes
  primaryName: String
  addresses: [ENSv2ResolverAddress!]! @derivedFrom(field: "record")
  texts: [ENSv2ResolverText!]! @derivedFrom(field: "record")
  datas: [ENSv2ResolverRecordData!]! @derivedFrom(field: "record")
  abis: [ENSv2ResolverABI!]! @derivedFrom(field: "record")
  interfaces: [ENSv2ResolverInterface!]! @derivedFrom(field: "record")
  links: [ENSv2ResolverLink!]! @derivedFrom(field: "record")
  memberships: [ENSv2ResolverRecordLinkMembership!]!
    @derivedFrom(field: "record")
  linkIndexCount: Int!
  addressIndexCount: Int!
  textIndexCount: Int!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

# One row per (resolver, node) — the name-to-record association, written by
# Linked. `record` is null exactly when `recordId` is the literal 0
# sentinel (an explicit unlink via linkToRecord(name, 0)), never deleted —
# retained as current state rather than deleting the row.
type ENSv2ResolverLink @entity(immutable: false) {
  id: Bytes! # resolver + node
  resolver: ENSv2Resolver!
  node: Bytes!
  name: Bytes! # DNS-encoded
  nameDecoded: String
  record: ENSv2ResolverRecord
  recordId: BigInt! # always set, including the literal 0 unlink sentinel
  active: Boolean! # recordId != 0
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverAddress @entity(immutable: false) {
  id: Bytes! # record + coinType
  record: ENSv2ResolverRecord!
  coinType: BigInt!
  index: Int!
  addressBytes: Bytes!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverText @entity(immutable: false) {
  id: Bytes! # record + keyHash
  record: ENSv2ResolverRecord!
  key: String!
  value: String!
  keyHash: Bytes!
  index: Int!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

# Explicit record-to-node membership. This is separate from
# ENSv2ResolverLink so a record can enumerate its current and former members
# without relying on @derivedFrom inside a mapping.
type ENSv2ResolverRecordLinkMembership @entity(immutable: false) {
  id: Bytes! # record + node
  record: ENSv2ResolverRecord!
  link: ENSv2ResolverLink!
  node: Bytes!
  index: Int!
  active: Boolean!
}

type ENSv2ResolverRecordLinkIndex @entity(immutable: true) {
  id: Bytes! # record + uint32(index)
  record: ENSv2ResolverRecord!
  index: Int!
  membership: ENSv2ResolverRecordLinkMembership!
}

type ENSv2ResolverAddressIndex @entity(immutable: true) {
  id: Bytes! # record + uint32(index)
  record: ENSv2ResolverRecord!
  index: Int!
  address: ENSv2ResolverAddress!
}

type ENSv2ResolverTextIndex @entity(immutable: true) {
  id: Bytes! # record + uint32(index)
  record: ENSv2ResolverRecord!
  index: Int!
  text: ENSv2ResolverText!
}

# Deliberately not named ENSv2ResolverData (the node-keyed PublicResolverV2
# DataChanged entity above) — PermissionedResolver's DataUpdated event's
# `value` param is non-indexed and fully recoverable, unlike the old
# DataChanged's (indexed-only, unrecoverable, why ENSv2ResolverData has no
# `value` field). Genuinely different capability;
# distinct entity name so a schema reader doesn't conflate the two.
type ENSv2ResolverRecordData @entity(immutable: false) {
  id: Bytes! # record + keyHash
  record: ENSv2ResolverRecord!
  key: String!
  value: Bytes!
  keyHash: Bytes!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverABI @entity(immutable: false) {
  id: Bytes! # record + contentType
  record: ENSv2ResolverRecord!
  contentType: BigInt!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverInterface @entity(immutable: false) {
  id: Bytes! # record + interfaceId
  record: ENSv2ResolverRecord!
  interfaceId: Bytes!
  implementer: Bytes!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2RegistryNamespaceIndex @entity(immutable: true) {
  id: Bytes! # registry + index
  registry: ENSv2Registry!
  index: Int!
  namespace: ENSv2Namespace!
}

type ENSv2SlotPathIndex @entity(immutable: true) {
  id: Bytes! # slot + index
  slot: ENSv2NameSlot!
  index: Int!
  path: ENSv2NamePath!
}

type ENSv2PathNamespaceIndex @entity(immutable: true) {
  id: Bytes! # path + index
  path: ENSv2NamePath!
  index: Int!
  namespace: ENSv2Namespace!
}

# Reverse of ENSv2PathNamespaceIndex above (path -> its namespaces) — this
# is namespace -> the paths materialised under it, needed to deactivate all
# of a namespace's paths in bounded time when the namespace itself is
# deactivated, the same way ENSv2SlotPathIndex already lets
# handleLabelUnregistered deactivate a slot's own paths.
type ENSv2NamespacePathIndex @entity(immutable: true) {
  id: Bytes! # namespace + index
  namespace: ENSv2Namespace!
  index: Int!
  path: ENSv2NamePath!
}

