specVersion: 0.0.4
description: A secure & decentralized way to address resources on and off the
  blockchain using simple, human-readable names. Access domains and transfer
  history.
repository: https://github.com/ensdomains/ens-subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ENSRegistry
    network: electroneum-mainnet
    source:
      abi: EnsRegistry
      address: "0x6f311f2212593165988dff84977e24c1005dbb85"
      startBlock: 15031539
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensRegistry.ts
      entities:
        - Domain
        - Account
        - Resolver
      abis:
        - name: EnsRegistry
          file: ./abis/Registry.json
      eventHandlers:
        - event: Transfer(indexed bytes32,address)
          handler: handleTransfer
        - event: NewOwner(indexed bytes32,indexed bytes32,address)
          handler: handleNewOwner
        - event: NewResolver(indexed bytes32,address)
          handler: handleNewResolver
        - event: NewTTL(indexed bytes32,uint64)
          handler: handleNewTTL
  - kind: ethereum/contract
    name: Resolver
    network: electroneum-mainnet
    source:
      abi: Resolver
      startBlock: 15031539
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/resolver.ts
      entities:
        - AddrChanged
        - MulticoinAddrChanged
        - NameChanged
        - AbiChanged
        - PubkeyChanged
        - Textchanged
        - ContenthashChanged
        - InterfaceChanged
        - AuthorisationChanged
      abis:
        - name: Resolver
          file: ./abis/PublicResolver.json
      eventHandlers:
        - event: ABIChanged(indexed bytes32,indexed uint256)
          handler: handleABIChanged
        - event: AddrChanged(indexed bytes32,address)
          handler: handleAddrChanged
        - event: AddressChanged(indexed bytes32,uint256,bytes)
          handler: handleMulticoinAddrChanged
        - event: ContenthashChanged(indexed bytes32,bytes)
          handler: handleContentHashChanged
        - event: InterfaceChanged(indexed bytes32,indexed bytes4,address)
          handler: handleInterfaceChanged
        - event: NameChanged(indexed bytes32,string)
          handler: handleNameChanged
        - event: PubkeyChanged(indexed bytes32,bytes32,bytes32)
          handler: handlePubkeyChanged
        - event: TextChanged(indexed bytes32,indexed string,string,string)
          handler: handleTextChangedWithValue
        - event: VersionChanged(indexed bytes32,uint64)
          handler: handleVersionChanged
  - kind: ethereum/contract
    name: BaseRegistrar
    network: electroneum-mainnet
    source:
      abi: BaseRegistrar
      address: "0x5207496c1248bbd2aeedd57bde44dd9d4e9f1b59"
      startBlock: 15031631
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - NameRegistered
        - NameRenewed
        - NameTransferred
      abis:
        - name: BaseRegistrar
          file: ./abis/BaseRegistrar.json
      eventHandlers:
        - event: NameRegistered(indexed uint256,indexed address,uint256)
          handler: handleNameRegistered
        - event: NameRenewed(indexed uint256,uint256)
          handler: handleNameRenewed
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleNameTransferred
  - kind: ethereum/contract
    name: EthRegistrarController
    network: electroneum-mainnet
    source:
      abi: EthRegistrarController
      address: "0x3cfa6d6e7e1216393c2cb9393bc0f411492e33e9"
      startBlock: 15031647
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
      abis:
        - name: EthRegistrarController
          file: ./abis/EthRegistrarController.json
      eventHandlers:
        - event: NameRegistered(string,indexed bytes32,indexed
            address,uint256,uint256,uint256,bytes32)
          handler: handleNameRegisteredByController
        - event: NameRenewed(string,indexed bytes32,uint256,uint256,bytes32)
          handler: handleNameRenewedByController
  # UniversalRegistrarRenewalWithReferrer: the wrapper-safe renewal path (all
  # dapp renewals route here). Emits NameRenewed with the exact same shape as
  # the controller, so it reuses the controller ABI and handler.
  - kind: ethereum/contract
    name: UniversalRenewal
    network: electroneum-mainnet
    source:
      abi: EthRegistrarController
      address: "0x8fcd8ebdc9db2cc29f334a922c11f0ccbc41a74f"
      startBlock: 15172506
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
      abis:
        - name: EthRegistrarController
          file: ./abis/EthRegistrarController.json
      eventHandlers:
        - event: NameRenewed(string,indexed bytes32,uint256,uint256,bytes32)
          handler: handleNameRenewedByController
  # ENSIP-19 default reverse registrar: primary names set by the v1.7
  # controller and the dapp live here (NOT under addr.reverse). Feeds the
  # primary_name_record table BENS reads for address->name resolution.
  - kind: ethereum/contract
    name: DefaultReverseRegistrar
    network: electroneum-mainnet
    source:
      abi: DefaultReverseRegistrar
      address: "0x3bed61fe4d7d3bc79e46912ee7acce2c231aa0a6"
      startBlock: 15031646
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/reverseRecords.ts
      entities:
        - PrimaryNameRecord
      abis:
        - name: DefaultReverseRegistrar
          file: ./abis/DefaultReverseRegistrar.json
      eventHandlers:
        - event: NameForAddrChanged(indexed address,string)
          handler: handleNameForAddrChanged
  # Classic reverse registrar: maps <addr>.addr.reverse nodes to addresses so
  # resolver NameChanged events on those nodes also feed PrimaryNameRecord.
  - kind: ethereum/contract
    name: ReverseRegistrar
    network: electroneum-mainnet
    source:
      abi: ReverseRegistrar
      address: "0xfbb14edbd8d3f6e7bb240bfa388f6582df0d8e7a"
      startBlock: 15031637
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/reverseRecords.ts
      entities:
        - ReverseClaim
      abis:
        - name: ReverseRegistrar
          file: ./abis/ReverseRegistrar.json
      eventHandlers:
        - event: ReverseClaimed(indexed address,indexed bytes32)
          handler: handleReverseClaimed
  - kind: ethereum/contract
    name: NameWrapper
    network: electroneum-mainnet
    source:
      abi: NameWrapper
      address: "0xd8f4b1a91469b05d9e0b15cac4917ee47b2a6f64"
      startBlock: 15031643
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/nameWrapper.ts
      entities:
        - NameWrapper
      abis:
        - name: NameWrapper
          file: ./abis/NameWrapper.json
      eventHandlers:
        - event: NameWrapped(indexed bytes32,bytes,address,uint32,uint64)
          handler: handleNameWrapped
        - event: NameUnwrapped(indexed bytes32,address)
          handler: handleNameUnwrapped
        - event: FusesSet(indexed bytes32,uint32)
          handler: handleFusesSet
        - event: ExpiryExtended(indexed bytes32,uint64)
          handler: handleExpiryExtended
        - event: TransferSingle(indexed address,indexed address,indexed
            address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed
            address,uint256[],uint256[])
          handler: handleTransferBatch
