[workspace]
resolver = "2"
members = [
    "stylus-verifier-logic",
    "stylus-verifier-proto",
    "stylus-verifier-server",
]

[workspace.dependencies]
stylus-verifier-logic = { path = "stylus-verifier-logic" }
stylus-verifier-proto = { path = "stylus-verifier-proto" }
stylus-verifier-server = { path = "stylus-verifier-server" }

alloy-json-abi = { version = "0.8.3" }
actix-prost = { version = "0.3.0" }
actix-prost-build = { version = "0.3.0" }
actix-prost-macros = { version = "0.3.0" }
actix-web = { version = "4" }
anyhow = { version = "1.0.87" }
async-trait = { version = "0.1.82" }
blockscout-display-bytes = { version = "1.1.0" }
blockscout-service-launcher = { version = "0.21.0" }
compiler-runner = { git = "https://github.com/blockscout/blockscout-rs", rev = "53fcbd1" }
bytes = { version = "1.7.1" }
futures-util = { version = "0.3.30" }
pretty_assertions = { version = "1.4.0" }
prost = { version = "0.14" }
prost-build = { version = "0.14" }
reqwest = { version = "0.12.7" }
rstest = { version = "0.26.1" }
semver = { version = "1.0.23" }
serde = { version = "1" }
serde_json = { version = "1.0.128" }
serde_with = { version = "3.9" }
thiserror = { version = "1.0.63" }
tokio = { version = "1.40.0" }
toml = { version = "0.8.19" }
tonic = { version = "0.14" }
tonic-prost = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tracing = { version = "0.1.40" }
url = { version = "2.5.2" }
