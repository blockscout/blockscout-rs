chains_config = "config/avalanche/chains.json"
bridges_config = "config/avalanche/bridges.json"

[token_info]
onchain_retry_interval = 10

[token_info.blockscout_token_info]
url = "https://contracts-info-test.k8s-dev.blockscout.com"
retry_interval = 1

[database.connect]
url = "postgres://postgres:postgres@database:5433/blockscout"

[example_indexer]
fetch_interval = 1

# Avalanche indexer settings (all fields optional, these are the defaults)
# [avalanche_indexer]
# pull_interval_ms = 10000
# batch_size = 1000

# [avalanche_indexer.failure_retry]
# enabled = true
# scan_interval = 60
# backoff_base = 30
# backoff_cap = 3600
# max_chunks_per_pass = 16
# record_retry_attempts = 3
# record_retry_initial_backoff = 200

# AMB indexer settings (all fields optional, these are the defaults)
# [amb_indexer]
# pull_interval_ms = 500
# batch_size = 1000
# receipt_concurrency = 25
# clock_skew_tolerance = 300

# [amb_indexer.failure_retry]
# enabled = true
# scan_interval = 60
# backoff_base = 30
# backoff_cap = 3600
# max_chunks_per_pass = 16
# record_retry_attempts = 3
# record_retry_initial_backoff = 200

[database.connect_options]
min_connections = 10
max_connections = 20
connect_timeout = 10
acquire_timeout = 10

[database]
create_database = true
run_migrations = true

[stats]
# backfill_on_start = false
# chains_recalculation_period_secs = 3600
# include_zero_chains = true

[api]
default_page_size = 50
max_page_size = 100
use_pagination_token = true
