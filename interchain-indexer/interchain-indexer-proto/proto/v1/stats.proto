syntax = "proto3";

package blockscout.interchainIndexer.v1;

option go_package = "github.com/blockscout/blockscout-rs/interchain-indexer";

import "v1/interchain_indexer.proto";

// Shared ascending/descending order for statistics list endpoints.
enum SortOrder {
  DESC = 0;
  ASC = 1;
}

// Response cursor for `/stats/chain/{chain_id}/bridged-tokens`.
// Tokens are only valid with the same `counterparty_chain_ids`, `bridge_ids`,
// `q`, `sort`, and `order` as the request that produced them.
message BridgedTokensListPagination {
  string page_token = 1;
  reserved 2 to 6; // former raw cursor fields
  reserved "direction", "asset_id", "name", "name_blank", "count";
}

// Response cursor for `/stats/chains`.
message StatsChainsListPagination {
  string page_token = 1;
  reserved 2 to 4; // former raw cursor fields
  reserved "direction", "count", "chain_id";
}

message GetMessagePathsRequest {
  // The home (focal) chain.
  int64 chain_id = 1;
  optional string from_date = 2; // YYYY-MM-DD
  optional string to_date = 3;   // YYYY-MM-DD
  optional string counterparty_chain_ids = 4;
  // Comma-separated bridge ids (see GET /api/v1/interchain/bridges). Restricts
  // the message paths to the selected bridges; bridge rows are summed per
  // directional edge. Absent or blank means all bridges. Composes with
  // `counterparty_chain_ids` through AND. Malformed/out-of-range values are
  // rejected with InvalidArgument.
  optional string bridge_ids = 5;
  // When true, also include message paths touching a chain that no configured
  // bridge indexes. Default (absent or false) hides them. Currently returns no
  // additional rows — the aggregates for unindexed chain pairs are not written
  // yet.
  optional bool include_unindexed_chains = 6;
}

message MessagePathRow {
  ChainInfo source_chain = 1;
  ChainInfo destination_chain = 2;
  uint64 messages_count = 3;
}

message GetMessagePathsResponse {
  repeated MessagePathRow items = 1;
}

service InterchainStatisticsService {
  rpc GetBridgedTokens(GetBridgedTokensRequest) returns (GetBridgedTokensResponse) {}
  rpc GetChainsStats(GetChainsStatsRequest) returns (GetChainsStatsResponse) {}
  rpc GetSentMessagePaths(GetMessagePathsRequest) returns (GetMessagePathsResponse) {}
  rpc GetReceivedMessagePaths(GetMessagePathsRequest) returns (GetMessagePathsResponse) {}
}

enum BridgedTokensSort {
  TOTAL_TRANSFERS_COUNT = 0;
  OUTPUT_TRANSFERS_COUNT = 1;
  INPUT_TRANSFERS_COUNT = 2;
  NAME = 3;
}

enum StatsChainsSort {
  UNIQUE_TRANSFER_USERS_COUNT = 0;
}

message GetBridgedTokensRequest {
  // The home (focal) chain.
  int64 chain_id = 1;
  optional uint32 page_size = 2;
  optional bool last_page = 3;
  // Sort field: TOTAL_TRANSFERS_COUNT[default] / OUTPUT_TRANSFERS_COUNT / INPUT_TRANSFERS_COUNT / NAME
  BridgedTokensSort sort = 4;
  // Sort order: DESC[default] / ASC
  SortOrder order = 5;
  
  // Opaque pagination cursor: pass `next_page_params.page_token` or
  // `prev_page_params.page_token` from a previous response unchanged. Valid
  // only with the same `chain_id`, `counterparty_chain_ids`, `bridge_ids`,
  // `include_unindexed_chains`, `q`, `sort`, and `order` as the request that
  // produced it. A malformed value is rejected with InvalidArgument.
  optional string page_token = 6;
  reserved 7 to 11; // former raw cursor fields
  reserved "direction", "asset_id", "name", "name_blank", "count";
  // Case-insensitive substring filter on the row display name (`stats_assets.name`).
  optional string q = 12;
  // Comma-separated chain ids. Restricts counterparty chains of the edges
  // aggregated for `{chain_id}`.
  optional string counterparty_chain_ids = 13;
  // Comma-separated bridge ids (see GET /api/v1/interchain/bridges). Restricts
  // the aggregated edges to the selected bridges; bridge rows are summed per
  // asset before pagination. Absent or blank means all bridges. Composes with
  // `counterparty_chain_ids` through AND. Malformed/out-of-range values are
  // rejected with InvalidArgument. Page tokens are scoped to the same bridge
  // and counterparty filters that produced them.
  optional string bridge_ids = 14;
  // When true, also include tokens/edges touching a chain that no configured
  // bridge indexes. Default (absent or false) hides them. Currently returns no
  // additional rows — the aggregates for unindexed chain pairs are not written
  // yet.
  //
  // The per-asset token list can only be restricted by the union across all
  // bridges (the underlying table carries no bridge id), while the edges
  // aggregate above is restricted per the edge's own bridge. So by default an
  // asset's token list omits tokens on chains no bridge indexes at all, but may
  // still list a token on a chain indexed only by a *different* bridge than the
  // one whose edges produced the asset.
  optional bool include_unindexed_chains = 15;
}

message GetChainsStatsRequest {
  optional uint32 page_size = 1;
  optional bool last_page = 2;
  // Optional comma-separated chain ids filter, for example `123,456`.
  // When absent or empty, statistics are returned for all known chains.
  // Selects subject rows (chains listed), not counterparties.
  optional string chain_ids = 3;
  // Sort order: DESC[default] / ASC
  SortOrder order = 4;

  // Opaque pagination cursor: pass `next_page_params.page_token` or
  // `prev_page_params.page_token` from a previous response unchanged. Valid
  // only with the same `bridge_ids`, `chain_ids`, `q`,
  // `include_unindexed_chains`, `sort`, and `order` as the request that
  // produced it. A malformed value is rejected with InvalidArgument.
  optional string page_token = 5;
  reserved 6 to 8; // former raw cursor fields
  reserved "direction", "count", "chain_id";
  // Case-insensitive substring filter on chain name or textual chain id.
  optional string q = 9;
  // Sort field: UNIQUE_TRANSFER_USERS_COUNT[default]
  StatsChainsSort sort = 10;
  // When true, also return chains that no configured bridge indexes. Default
  // (absent or false) omits them.
  optional bool include_unindexed_chains = 11;
  // Optional comma-separated bridge ids filter, for example `1,2`.
  // When absent or empty, counts come from the globally deduplicated snapshot
  // and are exact.
  // A single bridge id returns exact per-chain unique-user counts for that
  // bridge. Several bridge ids sum per-bridge distinct counts and can
  // overcount an address that appears on the SAME chain through more than one
  // selected bridge.
  // Malformed or out-of-int32-range ids return InvalidArgument. Unknown ids
  // are accepted and contribute nothing. Duplicate ids do not duplicate
  // counts. Disabled and removed bridges can still contribute retained
  // history.
  // The filter also scopes which chains can appear: a chain is a candidate
  // only when it is currently configured for at least one selected bridge or
  // has retained stats history for a selected bridge. Unrelated chains do not
  // become zero-count candidates, even with `include_unindexed_chains=true`.
  // `include_unindexed_chains` keeps its global meaning: a chain is unindexed
  // only when NO configured bridge indexes it; the flag controls visibility
  // among the selected bridge candidates described above.
  // Page tokens are valid only with the same `bridge_ids`,
  // `chain_ids`, `q`, `include_unindexed_chains`, `sort`, and `order` that
  // produced them.
  optional string bridge_ids = 12;
}

message StatsBridgedTokenItem {
  string chain_id = 1;
  // Null for a native token, which has no contract address.
  optional string token_address = 2;
  optional string name = 3;
  optional string symbol = 4;
  optional string icon_url = 5;
  optional uint32 decimals = 6;
  TokenInfo.TokenType type = 7;
}

message StatsBridgedTokenRow {
  string stats_asset_id = 1;
  optional string name = 2;
  optional string symbol = 3;
  optional string icon_url = 4;
  uint64 input_transfers_count = 5;
  uint64 output_transfers_count = 6;
  uint64 total_transfers_count = 7;
  repeated StatsBridgedTokenItem tokens = 8;
}

message GetBridgedTokensResponse {
  repeated StatsBridgedTokenRow items = 1;
  optional BridgedTokensListPagination next_page_params = 2;
  optional BridgedTokensListPagination prev_page_params = 3;
}

message StatsChainRow {
  string id = 1;
  string name = 2;
  optional string logo = 3;
  optional string explorer_url = 4;
  uint64 unique_transfer_users_count = 5;
}

message GetChainsStatsResponse {
  repeated StatsChainRow items = 1;
  optional StatsChainsListPagination next_page_params = 2;
  optional StatsChainsListPagination prev_page_params = 3;
}
