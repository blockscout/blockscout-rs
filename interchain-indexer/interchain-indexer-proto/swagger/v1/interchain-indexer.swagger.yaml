        - name: page_token
          description: |-
            Opaque pagination cursor: pass `next_page_params.page_token` or
            `prev_page_params.page_token` from a previous response unchanged. Valid
            only with the same filters and path scope as the request that produced
            it. A malformed value is rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: home_chain_id
          description: 'Filter: only messages touching this chain (src = N OR dst = N).'
          in: query
          required: false
          type: string
          format: int64
        - name: counterparty_chain_ids
          description: |-
            Comma-separated chain ids. With home_chain_id: restricts the other
