            $ref: '#/definitions/v1GetMessagePathsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: chain_id
          description: The home (focal) chain.
          in: path
          required: true
          type: string
          format: int64
        - name: from_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: to_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: counterparty_chain_ids
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Comma-separated bridge ids (see GET /api/v1/interchain/bridges). Restricts
            the message paths to the selected bridges; bridge rows are summed per
            directional edge. Absent or blank means all bridges. Composes with
            `counterparty_chain_ids` through AND. Malformed/out-of-range values are
            rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: include_unindexed_chains
          description: |-
            When true, also include message paths touching a chain that no configured
            bridge indexes. Default (absent or false) hides them. Currently returns no
            additional rows — the aggregates for unindexed chain pairs are not written
            yet.
          in: query
          required: false
          type: boolean
      tags:
        - InterchainStatisticsService
  /api/v1/stats/chain/{chain_id}/messages-paths/sent:
    get:
      operationId: InterchainStatisticsService_GetSentMessagePaths
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetMessagePathsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: chain_id
          description: The home (focal) chain.
          in: path
          required: true
          type: string
          format: int64
        - name: from_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: to_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: counterparty_chain_ids
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Comma-separated bridge ids (see GET /api/v1/interchain/bridges). Restricts
            the message paths to the selected bridges; bridge rows are summed per
            directional edge. Absent or blank means all bridges. Composes with
            `counterparty_chain_ids` through AND. Malformed/out-of-range values are
            rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: include_unindexed_chains
          description: |-
            When true, also include message paths touching a chain that no configured
            bridge indexes. Default (absent or false) hides them. Currently returns no
            additional rows — the aggregates for unindexed chain pairs are not written
            yet.
          in: query
          required: false
          type: boolean
      tags:
        - InterchainStatisticsService
  /api/v1/stats/chains:
    get:
      operationId: InterchainStatisticsService_GetChainsStats
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetChainsStatsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          in: query
          required: false
          type: integer
          format: int64
        - name: last_page
          in: query
          required: false
          type: boolean
        - name: chain_ids
          description: |-
            Optional comma-separated chain ids filter, for example `123,456`.
            When absent or empty, statistics are returned for all known chains.
            Selects subject rows (chains listed), not counterparties.
          in: query
          required: false
          type: string
        - name: order
          description: 'Sort order: DESC[default] / ASC'
          in: query
          required: false
          type: string
          enum:
            - DESC
            - ASC
          default: DESC
        - name: page_token
          description: |-
            Opaque pagination cursor: pass `next_page_params.page_token` or
            `prev_page_params.page_token` from a previous response unchanged. Valid
            only with the same `bridge_ids`, `chain_ids`, `q`,
            `include_unindexed_chains`, `sort`, and `order` as the request that
            produced it. A malformed value is rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: q
          description: Case-insensitive substring filter on chain name or textual chain id.
          in: query
          required: false
          type: string
        - name: sort
          description: 'Sort field: UNIQUE_TRANSFER_USERS_COUNT[default]'
          in: query
          required: false
          type: string
          enum:
            - UNIQUE_TRANSFER_USERS_COUNT
          default: UNIQUE_TRANSFER_USERS_COUNT
        - name: include_unindexed_chains
          description: |-
            When true, also return chains that no configured bridge indexes. Default
            (absent or false) omits them.
          in: query
          required: false
          type: boolean
        - name: bridge_ids
          description: |-
            Optional comma-separated bridge ids filter, for example `1,2`.
            When absent or empty, counts come from the globally deduplicated snapshot
            and are exact.
            A single bridge id returns exact per-chain unique-user counts for that
            bridge. Several bridge ids sum per-bridge distinct counts and can
            overcount an address that appears on the SAME chain through more than one
            selected bridge.
            Malformed or out-of-int32-range ids return InvalidArgument. Unknown ids
            are accepted and contribute nothing. Duplicate ids do not duplicate
            counts. Disabled and removed bridges can still contribute retained
            history.
            The filter also scopes which chains can appear: a chain is a candidate
            only when it is currently configured for at least one selected bridge or
            has retained stats history for a selected bridge. Unrelated chains do not
            become zero-count candidates, even with `include_unindexed_chains=true`.
            `include_unindexed_chains` keeps its global meaning: a chain is unindexed
            only when NO configured bridge indexes it; the flag controls visibility
            among the selected bridge candidates described above.
            Page tokens are valid only with the same `bridge_ids`,
            `chain_ids`, `q`, `include_unindexed_chains`, `sort`, and `order` that
            produced them.
          in: query
          required: false
          type: string
      tags:
        - InterchainStatisticsService
  /api/v1/status/indexers:
    get:
      operationId: StatusService_GetFullStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1FullStatus'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - StatusService
  /api/v1/status/indexers/{indexer_name}:
    get:
      operationId: StatusService_GetStatusByIndexerName
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1IndexerStatus'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: indexer_name
          in: path
          required: true
          type: string
      tags:
        - StatusService
  /api/v1/status/indexing:
    get:
      operationId: StatusService_GetIndexingProgress
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetIndexingProgressResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: bridge_id
          in: query
          required: false
          type: integer
          format: int32
        - name: chain_id
          in: query
          required: false
          type: string
          format: int64
      tags:
        - StatusService
  /health:
    get:
      summary: |-
        If the requested service is unknown, the call will fail with status
        NOT_FOUND.
      operationId: Health_Check
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1HealthCheckResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: service
          in: query
          required: false
          type: string
      tags:
        - Health
definitions:
  HealthCheckResponseServingStatus:
    type: string
    enum:
      - UNKNOWN
      - SERVING
      - NOT_SERVING
      - SERVICE_UNKNOWN
    default: UNKNOWN
    description: ' - SERVICE_UNKNOWN: Used only by the Watch method.'
  TokenInfoTokenType:
    type: string
    enum:
      - UNSPECIFIED
      - ERC20
      - NATIVE
      - ERC721
      - ERC1155
    default: UNSPECIFIED
    description: Token kind. UNSPECIFIED is the proto3 default and is never returned.
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      `NullValue` is a singleton enumeration to represent the null value for the
      `Value` type union.

      The JSON representation for `NullValue` is JSON `null`.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1AddressInfo:
    type: object
    properties:
      hash:
        type: string
      ens_domain_name:
        type: string
  v1Bridge:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      type:
        type: string
        title: '"lockmint" | "avalanche_native" | "amb"'
      enabled:
        type: boolean
      ui_url:
        type: string
      docs_url:
        type: string
      indexed_chain_ids:
        type: array
        items:
          type: string
        description: |-
          Chain ids this bridge actually indexes today, sorted ascending. Derived
          from the in-memory bridges config (`IndexedChains`), not from historical
          `bridge_contracts` rows, so a bridge removed from config but still
          present in the `bridges` table (upserts never delete) reports an empty
          list here rather than stale contract history.
          The ids are decimal strings, matching `ChainInfo.id`.
  v1BridgeInfo:
    type: object
    properties:
      name:
        type: string
      ui_url:
        type: string
      docs_url:
        type: string
      id:
        type: integer
        format: int64
        description: Bridge id usable in bridge_ids filters.
  v1BridgedTokensSort:
    type: string
    enum:
      - TOTAL_TRANSFERS_COUNT
      - OUTPUT_TRANSFERS_COUNT
      - INPUT_TRANSFERS_COUNT
      - NAME
    default: TOTAL_TRANSFERS_COUNT
  v1ChainIndexingProgress:
    type: object
    properties:
      bridge_id:
        type: integer
        format: int32
      chain_id:
        type: string
      start_block:
        type: string
        format: uint64
        description: |-
          The unscanned interval is [catchup_min_cursor, catchup_max_cursor], inclusive.
          Both are "next block to scan" boundaries, so catch-up can close the interval
          from either end. An empty interval means the scan is complete.

          configured started_at_block
      catchup_min_cursor:
        type: string
        format: uint64
      catchup_max_cursor:
        type: string
        format: uint64
      realtime_cursor:
        type: string
        format: uint64
      catchup_complete:
        type: boolean
        description: |-
          catchup_progress_percent == 100.0 AND failed_blocks == 0: everything in
          scope was scanned and nothing is recorded as missing. Derivable from the
          two fields below, on purpose.
      catchup_progress_percent:
        type: number
        format: double
        title: scanned share, NOT a completeness measure
      catchup_blocks_remaining:
        type: string
        format: uint64
      failed_blocks:
        type: string
        format: uint64
        description: |-
          Blocks inside unresolved holes. A single number on purpose: which ranges
          failed and why is operator-side diagnostics, not API surface.
      checkpoint_updated_at:
        type: string
  v1ChainInfo:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      logo:
        type: string
      explorer_url:
        type: string
      custom_tx_route:
        type: string
      custom_address_route:
        type: string
      custom_token_route:
        type: string
  v1FullStatus:
    type: object
    properties:
      indexers:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1IndexerStatus'
  v1GetBridgedTokensResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1StatsBridgedTokenRow'
      next_page_params:
        $ref: '#/definitions/v1Pagination'
      prev_page_params:
        $ref: '#/definitions/v1Pagination'
  v1GetBridgesResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Bridge'
  v1GetChainsResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ChainInfo'
  v1GetChainsStatsResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1StatsChainRow'
      next_page_params:
        $ref: '#/definitions/v1Pagination'
      prev_page_params:
        $ref: '#/definitions/v1Pagination'
  v1GetIndexingProgressResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ChainIndexingProgress'
  v1GetMessagePathsResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1MessagePathRow'
  v1GetMessagesResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InterchainMessage'
      next_page_params:
        $ref: '#/definitions/v1Pagination'
      prev_page_params:
        $ref: '#/definitions/v1Pagination'
  v1GetTransfersResponse:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InterchainTransfer'
      next_page_params:
        $ref: '#/definitions/v1Pagination'
      prev_page_params:
        $ref: '#/definitions/v1Pagination'
  v1HealthCheckResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/HealthCheckResponseServingStatus'
  v1IndexerStatus:
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      state:
        type: string
      init_timestamp:
        type: string
      extra_info:
        type: object
  v1InterchainMessage:
    type: object
    properties:
      bridge:
        $ref: '#/definitions/v1BridgeInfo'
      message_id:
        type: string
      status:
        $ref: '#/definitions/v1MessageStatus'
      source_chain:
        $ref: '#/definitions/v1ChainInfo'
      send_timestamp:
        type: string
      sender:
        $ref: '#/definitions/v1AddressInfo'
      source_transaction_hash:
        type: string
      destination_chain:
        $ref: '#/definitions/v1ChainInfo'
      receive_timestamp:
        type: string
      recipient:
        $ref: '#/definitions/v1AddressInfo'
      destination_transaction_hash:
        type: string
      payload:
        type: string
      extra:
        type: object
        description: |-
          Additional parsed data, keyed by concept namespace. Each value is an
          arbitrary JSON object whose shape belongs to that namespace, so a new
          concept is a new key rather than a new flat key prefix.
      transfers:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InterchainTransfer'
      has_unindexed_chain:
        type: boolean
        description: |-
          True when this record's source or destination chain is not indexed by its
          own bridge (an unknown destination also counts). Such a record can never be
          observed from both sides.
  v1InterchainTransfer:
    type: object
    properties:
      bridge:
        $ref: '#/definitions/v1BridgeInfo'
      message_id:
        type: string
      status:
        $ref: '#/definitions/v1MessageStatus'
      source_chain:
        $ref: '#/definitions/v1ChainInfo'
      destination_chain:
        $ref: '#/definitions/v1ChainInfo'
      source_token:
        $ref: '#/definitions/v1TokenInfo'
      source_amount:
        type: string
      source_transaction_hash:
        type: string
      sender:
        $ref: '#/definitions/v1AddressInfo'
      send_timestamp:
        type: string
      destination_token:
        $ref: '#/definitions/v1TokenInfo'
      destination_amount:
        type: string
      destination_transaction_hash:
        type: string
      recipient:
        $ref: '#/definitions/v1AddressInfo'
      receive_timestamp:
        type: string
      has_unindexed_chain:
        type: boolean
        description: |-
          True when this record's source or destination chain is not indexed by its
          own bridge (an unknown destination also counts). Such a record can never be
          observed from both sides.
  v1MessagePathRow:
    type: object
    properties:
      source_chain:
        $ref: '#/definitions/v1ChainInfo'
      destination_chain:
        $ref: '#/definitions/v1ChainInfo'
      messages_count:
        type: string
        format: uint64
  v1MessageStatus:
    type: string
    enum:
      - MESSAGE_STATUS_INITIATED
      - MESSAGE_STATUS_COMPLETED
      - MESSAGE_STATUS_FAILED
      - MESSAGE_STATUS_READY_TO_CLAIM
    default: MESSAGE_STATUS_INITIATED
  v1Pagination:
    type: object
    properties:
      page_token:
        type: string
    description: |-
      Opaque keyset cursor returned as `next_page_params` / `prev_page_params` by
      every list endpoint. Send `page_token` back unchanged. A token is valid only
      with the same filters (`home_chain_id`, `counterparty_chain_ids`,
      `src_chain_ids`, `dst_chain_ids`, `bridge_ids`, `chain_ids`,
      `include_unindexed_chains`), path scope (cluster_id, tx_hash, address, chain_id) and, for
      stats lists, `q`, `sort` and `order` as the request that produced it. The
      cursor does not encode them and is not re-validated against them, so
      changing any of them mid-pagination is unsupported and yields undefined
      results; callers must restart pagination when they change.
  v1RescanBlockRange:
    type: object
    properties:
      bridge_id:
        type: integer
        format: int32
      chain_id:
        type: string
        format: int64
        description: Chain id (a JSON string).
      from_block:
        type: string
        format: uint64
        description: First block, inclusive (a JSON string).
      to_block:
        type: string
        format: uint64
        description: Last block, inclusive (a JSON string).
  v1RescanBlockRangesRequest:
    type: object
    properties:
      ranges:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RescanBlockRange'
        description: At most 100 ranges, at most 2,000,000 blocks in total after merging.
      reason:
        type: string
        description: Why the rescan is requested (1..1000 characters), e.g. a ticket link.
      dry_run:
        type: boolean
        description: '`true` validates and estimates without writing anything.'
  v1RescanBlockRangesResponse:
    type: object
    properties:
      audit_id:
        type: string
        format: int64
        description: Audit-log row id; `null` for a dry run.
      scheduled_ranges:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RescanBlockRange'
        description: |-
          Accepted ranges of THIS request after normalization (merged per pair, sorted by
          bridge, chain, block). Not a snapshot of stored ledger rows: a stored row may be
          wider if an adjacent failure is merged concurrently.
      requested_blocks:
        type: string
        format: uint64
        description: Total blocks in `scheduled_ranges`.
      estimates:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RescanBridgeEstimate'
  v1RescanBridgeEstimate:
    type: object
    properties:
      bridge_id:
        type: integer
        format: int32
      estimated_drain_seconds:
        type: string
        format: uint64
        description: Approximate time to replay this request's ranges, in seconds.
  v1SetStatsAssetIconRequest:
    type: object
    properties:
      stats_asset_id:
        type: string
        format: int64
        description: '`stats_asset_id` from the bridged-tokens response (a JSON string).'
      icon_url:
        type: string
        description: New icon URL (https, at most 2048 bytes). Exactly one of `icon_url`, `clear`.
      clear:
        type: boolean
        description: '`true` clears the icon. Exactly one of `icon_url`, `clear`.'
      reason:
        type: string
        description: Why the change is made (1..1000 characters), e.g. a ticket link.
  v1SetStatsAssetIconResponse:
    type: object
    properties:
      audit_id:
        type: string
        format: int64
        description: Id of the audit-log row that recorded the change.
      icon_url_before:
        type: string
        description: '`null` when the asset had no icon.'
      icon_url_after:
        type: string
        description: '`null` after `clear`.'
  v1SetTokenIconRequest:
    type: object
    properties:
      chain_id:
        type: string
        format: int64
        description: Chain id (a JSON string).
      address:
        type: string
        description: 0x-prefixed 20-byte token address. Exactly one of `address`, `native`.
      native:
        type: boolean
        description: '`true` selects the chain''s native token (shown with a null address in the API).'
      icon_url:
        type: string
        description: New icon URL (https, at most 2048 bytes). Exactly one of `icon_url`, `clear`.
      clear:
        type: boolean
        description: '`true` clears the icon. Exactly one of `icon_url`, `clear`.'
      reason:
        type: string
        description: Why the change is made (1..1000 characters), e.g. a ticket link.
  v1SetTokenIconResponse:
    type: object
    properties:
      audit_id:
        type: string
        format: int64
        description: Id of the audit-log row that recorded the change.
      icon_url_before:
        type: string
        description: '`null` when the token had no icon.'
      icon_url_after:
        type: string
        description: '`null` after `clear`.'
  v1SortOrder:
    type: string
    enum:
      - DESC
      - ASC
    default: DESC
    description: Shared ascending/descending order for statistics list endpoints.
  v1StatsBridgedTokenItem:
    type: object
    properties:
      chain_id:
        type: string
      token_address:
        type: string
        description: Null for a native token, which has no contract address.
      name:
        type: string
      symbol:
        type: string
      icon_url:
        type: string
      decimals:
        type: integer
        format: int64
      type:
        $ref: '#/definitions/TokenInfoTokenType'
  v1StatsBridgedTokenRow:
    type: object
    properties:
      stats_asset_id:
        type: string
      name:
        type: string
      symbol:
        type: string
      icon_url:
        type: string
      input_transfers_count:
        type: string
        format: uint64
      output_transfers_count:
        type: string
        format: uint64
      total_transfers_count:
        type: string
        format: uint64
      tokens:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1StatsBridgedTokenItem'
  v1StatsChainRow:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      logo:
        type: string
      explorer_url:
        type: string
      unique_transfer_users_count:
        type: string
        format: uint64
  v1StatsChainsSort:
    type: string
    enum:
      - UNIQUE_TRANSFER_USERS_COUNT
    default: UNIQUE_TRANSFER_USERS_COUNT
  v1TokenInfo:
    type: object
    properties:
      address_hash:
        type: string
        description: Null for a native token (`type == NATIVE`), which has no contract address.
      name:
        type: string
      symbol:
        type: string
      decimals:
        type: string
      icon_url:
        type: string
      type:
        $ref: '#/definitions/TokenInfoTokenType'
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: x-api-key
    in: header
externalDocs:
  description: More about blockscout microservices
  url: https://github.com/blockscout/blockscout-rs
