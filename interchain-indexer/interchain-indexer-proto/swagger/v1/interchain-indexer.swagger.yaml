        - name: page_size
          in: query
          required: false
          type: integer
          format: int64
        - name: last_page
          in: query
          required: false
          type: boolean
        - name: sort
          description: 'Sort field: TOTAL_TRANSFERS_COUNT[default] / OUTPUT_TRANSFERS_COUNT / INPUT_TRANSFERS_COUNT / NAME'
          in: query
          required: false
          type: string
          enum:
            - TOTAL_TRANSFERS_COUNT
            - OUTPUT_TRANSFERS_COUNT
            - INPUT_TRANSFERS_COUNT
            - NAME
          default: TOTAL_TRANSFERS_COUNT
        - name: order
          description: 'Sort order: DESC[default] / ASC'
          in: query
          required: false
          type: string
          enum:
            - DESC
            - ASC
          default: DESC
        - name: page_token
          description: |-
            Opaque pagination cursor: pass `next_page_params.page_token` or
            `prev_page_params.page_token` from a previous response unchanged. Valid
            only with the same `chain_id`, `counterparty_chain_ids`, `bridge_ids`,
            `include_unindexed_chains`, `q`, `sort`, and `order` as the request that
            produced it. A malformed value is rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: q
          description: Case-insensitive substring filter on the row display name (`stats_assets.name`).
          in: query
          required: false
          type: string
        - name: counterparty_chain_ids
          description: |-
            Comma-separated chain ids. Restricts counterparty chains of the edges
            aggregated for `{chain_id}`.
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Comma-separated bridge ids (see GET /api/v1/interchain/bridges). Restricts
            the aggregated edges to the selected bridges; bridge rows are summed per
            asset before pagination. Absent or blank means all bridges. Composes with
            `counterparty_chain_ids` through AND. Malformed/out-of-range values are
            rejected with InvalidArgument. Page tokens are scoped to the same bridge
            and counterparty filters that produced them.
          in: query
          required: false
          type: string
        - name: include_unindexed_chains
          description: |-
            When true, also include tokens/edges touching a chain that no configured
            bridge indexes. Default (absent or false) hides them. Currently returns no
            additional rows — the aggregates for unindexed chain pairs are not written
            yet.

            The per-asset token list can only be restricted by the union across all
            bridges (the underlying table carries no bridge id), while the edges
            aggregate above is restricted per the edge's own bridge. So by default an
            asset's token list omits tokens on chains no bridge indexes at all, but may
            still list a token on a chain indexed only by a *different* bridge than the
            one whose edges produced the asset.
          in: query
          required: false
          type: boolean
      tags:
        - InterchainStatisticsService
