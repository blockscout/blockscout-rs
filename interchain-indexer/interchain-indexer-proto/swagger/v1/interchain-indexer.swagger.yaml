  /api/v1/interchain/chains:
    get:
      operationId: InterchainService_GetChains
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetChainsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: include_unindexed_chains
          description: |-
            When true, also return chains that no configured bridge indexes.
            Default (absent or false) omits them.
          in: query
          required: false
          type: boolean
        - name: chain_ids
          description: |-
            Optional comma-separated chain ids filter, for example `123,456`.
            When absent or empty, all known chains are returned. Selects the returned
            rows by chain id. Unknown ids match nothing; duplicates are idempotent.
            Malformed or out-of-int64-range values return InvalidArgument.
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Optional comma-separated bridge ids filter, for example `1,2`
            (see GET /api/v1/interchain/bridges). Restricts the response to chains the
            selected bridges index today -- the union of their
            `Bridge.indexed_chain_ids`, derived from the in-memory bridges config,
            never from historical `bridge_contracts` rows.
            The returned rows are that union INTERSECTED with the chain directory this
            endpoint serves, which is upserted from `chains.json`. The two coincide in
            practice, but a chain that a selected bridge indexes and that has no entry
            in the chain directory is listed by GET /api/v1/interchain/bridges and is
            not returned here, because there is no chain row to return.
            When absent or empty, no bridge restriction is applied. A non-empty
            selection naming only unknown, removed, or contract-less bridges returns an
            EMPTY list, not the full directory. Malformed or out-of-int32-range values
            return InvalidArgument; duplicates are idempotent. Composes with
            `chain_ids` and `include_unindexed_chains` through AND.

            NOTE: this deliberately differs from GET /api/v1/stats/chains?bridge_ids=,
            which additionally admits a chain with retained per-bridge stats history
            for a selected bridge. For a bridge removed from configuration,
            /stats/chains can still list its historical chains while this endpoint
            lists none. That is by design: this endpoint applies the same
            currently-configured membership that `Bridge.indexed_chain_ids` reports.
          in: query
          required: false
          type: string
      tags:
        - InterchainService
