swagger: "2.0"
info:
  title: Interchain Indexer service
  version: 0.1.1
  contact:
    name: Blockscout
    url: https://blockscout.com
    email: support@blockscout.com
tags:
  - name: InterchainService
  - name: InterchainStatisticsService
  - name: InterchainClusterService
  - name: InterchainClusterStatisticsService
  - name: StatusService
  - name: Health
  - name: InterchainAdminService
host: interchain-indexer.services.blockscout.com
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/v1/admin/indexing:rescanBlockRanges:
    post:
      summary: |-
        Queues block ranges for re-scanning by the running indexer's failed-range
        replay. This RESCANS; it does not repair already-stored data (no deletes, no
        NULL-ing, no stats recount). Requests may not touch open failed ranges, the
        unscanned catch-up interval, or blocks at/after the realtime cursor. Use
        `dry_run` first. The estimate is approximate: the replay budget is shared
        with real failed ranges of the bridge.
      operationId: InterchainAdminService_RescanBlockRanges
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RescanBlockRangesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1RescanBlockRangesRequest'
      tags:
        - Admin
      security:
        - ApiKeyAuth: []
  /api/v1/admin/stats/assets:setIcon:
    post:
      summary: |-
        Sets or clears the row icon of one bridged-token asset (the `icon_url` of a
        `GET /api/v1/stats/chain/{chain_id}/bridged-tokens` row). Does not change
        token icons. A manual asset icon is not replaced by derivation, but it is
        lost if the asset later loses a merge, and a concurrent fill of an empty
        name/symbol/icon can revert it.
      operationId: InterchainAdminService_SetStatsAssetIcon
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SetStatsAssetIconResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1SetStatsAssetIconRequest'
      tags:
        - Admin
      security:
        - ApiKeyAuth: []
  /api/v1/admin/tokens:setIcon:
    post:
      summary: |-
        Sets or clears the icon of one token that already has a `tokens` row. The
        token-info source (Blockscout) remains the source of truth: an icon it
        later provides replaces the value set here; its absence never erases it.
        Does not change bridged-token asset icons.
      operationId: InterchainAdminService_SetTokenIcon
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SetTokenIconResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1SetTokenIconRequest'
      tags:
        - Admin
      security:
        - ApiKeyAuth: []
  /api/v1/clusters/{cluster_id}/interchain/bridges:
    get:
      summary: |-
        Bridge directory restricted to the cluster's bridge_ids (all bridges when
        the cluster sets none). Each entry is returned unchanged.
      operationId: InterchainClusterService_GetBridges
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetBridgesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: cluster_id
          in: path
          required: true
          type: string
      tags:
        - InterchainClusterService
  /api/v1/clusters/{cluster_id}/interchain/chains:
    get:
      summary: Chain directory restricted to the cluster's chains (and `chain_ids`).
      operationId: InterchainClusterService_GetChains
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetChainsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: cluster_id
          in: path
          required: true
          type: string
        - name: chain_ids
          description: |-
            Optional comma-separated chain ids, for example `123,456`. Intersected with
            the cluster's chains: home_chain_id plus counterparty_chain_ids, or
            counterparty_chain_ids alone, or every chain when the cluster sets no
            counterparty_chain_ids. Ids outside the cluster's chains match nothing, so
            a selection with none inside returns an empty list. The rows are then
            restricted, as on GET /api/v1/interchain/chains, to the chains the
            cluster's bridges index today and, unless the cluster sets
            include_unindexed_chains, to chains some configured bridge indexes.
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Optional comma-separated bridge ids. Narrows the request to these bridges
            inside the cluster's bridge_ids (all bridges when the cluster sets none).
            Ids outside the cluster match nothing, so a selection with none inside
            returns an empty list. Malformed values return InvalidArgument.
            The rows are then restricted to the chains the selected bridges index
            today, as on GET /api/v1/interchain/chains.
          in: query
          required: false
          type: string
      tags:
        - InterchainClusterService
  /api/v1/clusters/{cluster_id}/interchain/messages:
    get:
      operationId: InterchainClusterService_GetMessages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetMessagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: cluster_id
          in: path
          required: true
          type: string
        - name: q
          description: multisearch ability
          in: query
          required: false
          type: string
        - name: page_size
          description: 'Items on a page: bounded by the API settings'
          in: query
          required: false
          type: integer
          format: int64
        - name: last_page
          description: If true, return only the last page (pagination token is ignored)
          in: query
          required: false
          type: boolean
        - name: page_token
          description: |-
            Opaque pagination cursor: pass `next_page_params.page_token` or
            `prev_page_params.page_token` from a previous response unchanged. Valid
            only with the same cluster, filters and path scope as the request that
            produced it. A malformed value is rejected with InvalidArgument.
          in: query
          required: false
          type: string
        - name: src_chain_ids
          description: |-
            Comma-separated source chain ids. Narrows the cluster's messages through
            AND (messages whose src_chain_id is in this set).
          in: query
          required: false
          type: string
        - name: dst_chain_ids
          description: |-
            Comma-separated destination chain ids. Narrows the cluster's messages
            through AND (messages whose dst_chain_id is in this set). A destination
            filter excludes messages with a NULL destination.
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Optional comma-separated bridge ids. Narrows the request to these bridges
            inside the cluster's bridge_ids (all bridges when the cluster sets none).
            Ids outside the cluster match nothing, so a selection with none inside
            returns an empty list. Malformed values return InvalidArgument.
          in: query
          required: false
          type: string
      tags:
        - InterchainClusterService
  /api/v1/clusters/{cluster_id}/interchain/messages/{message_id}:
    get:
      summary: |-
        Message details. A message outside the cluster returns NotFound, the same
        as a missing one. An id shared with a bridge outside the cluster resolves
        without bridge_id. The message's transfers are returned unfiltered.
      operationId: InterchainClusterService_GetMessageDetails
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1InterchainMessage'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: cluster_id
          in: path
          required: true
          type: string
        - name: message_id
          in: path
          required: true
          type: string
        - name: bridge_id
          description: |-
            Optional bridge qualifier. Needed only when message_id exists in more than
            one bridge inside the cluster; an ambiguous unqualified lookup returns
            FailedPrecondition (HTTP 400).
          in: query
          required: false
          type: integer
          format: int64
      tags:
        - InterchainClusterService
