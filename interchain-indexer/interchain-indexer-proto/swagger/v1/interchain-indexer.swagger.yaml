  /api/v1/clusters/{cluster_id}/stats/chain/{chain_id}/bridged-tokens:
    get:
      summary: |-
        Bridged tokens of `chain_id` within the cluster. When the cluster defines a
        chain set, `chain_id` must belong to it (else InvalidArgument), and the
        counterparty chains are derived from the cluster. The rows and their
        transfer counts are cluster-scoped; the `tokens` list of a row is NOT: as
        on the legacy route, it lists the asset's tokens on every chain some
        configured bridge indexes (every chain when the cluster sets
        include_unindexed_chains).
      operationId: InterchainClusterStatisticsService_GetBridgedTokens
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetBridgedTokensResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: cluster_id
          in: path
          required: true
          type: string
        - name: chain_id
          description: |-
            The focal chain. Must belong to the cluster's chains when the cluster
            defines them (else InvalidArgument); the counterparty chains are derived
            from the cluster.
          in: path
          required: true
          type: string
          format: int64
        - name: page_size
          in: query
          required: false
          type: integer
          format: int64
        - name: last_page
          in: query
          required: false
          type: boolean
        - name: sort
          description: 'Sort field: TOTAL_TRANSFERS_COUNT[default] / OUTPUT_TRANSFERS_COUNT / INPUT_TRANSFERS_COUNT / NAME'
          in: query
          required: false
          type: string
          enum:
            - TOTAL_TRANSFERS_COUNT
            - OUTPUT_TRANSFERS_COUNT
            - INPUT_TRANSFERS_COUNT
            - NAME
          default: TOTAL_TRANSFERS_COUNT
        - name: order
          description: 'Sort order: DESC[default] / ASC'
          in: query
          required: false
          type: string
          enum:
            - DESC
            - ASC
          default: DESC
        - name: page_token
          description: |-
            Opaque pagination cursor: pass `next_page_params.page_token` or
            `prev_page_params.page_token` from a previous response unchanged. Valid
            only with the same cluster, `chain_id`, `bridge_ids`, `q`, `sort` and
            `order` as the request that produced it. A malformed value is rejected
            with InvalidArgument.
          in: query
          required: false
          type: string
        - name: q
          description: Case-insensitive substring filter on the row display name (`stats_assets.name`).
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
            Optional comma-separated bridge ids. Narrows the request to these bridges
            inside the cluster's bridge_ids (all bridges when the cluster sets none).
            Ids outside the cluster match nothing, so a selection with none inside
            returns an empty list. Malformed values return InvalidArgument.
          in: query
          required: false
          type: string
      tags:
        - InterchainClusterStatisticsService
  /api/v1/clusters/{cluster_id}/stats/chain/{chain_id}/messages-paths/received:
    get:
      summary: |-
        Incoming message paths of `chain_id` within the cluster; `chain_id` rules
