      tags:
        - InterchainClusterStatisticsService
  /api/v1/clusters/{cluster_id}/stats/chains:
    get:
      summary: |-
        Per-chain statistics, rows restricted to the cluster's chains (and
        `chain_ids`). The unique_transfer_users_count of each row is NOT scoped to
        the cluster: it is the chain's global deduplicated count or, when the
        request's effective bridge set is non-empty (the cluster's bridge_ids
        narrowed by the bridge_ids param), the sum of the per-bridge counts of
        those bridges (which can overcount an address seen through several of them).
      operationId: InterchainClusterStatisticsService_GetChainsStats
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetChainsStatsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
