          description: The focal chain; rules as in GetClusterBridgedTokensRequest.chain_id.
          in: path
          required: true
          type: string
          format: int64
        - name: from_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: to_date
          description: YYYY-MM-DD
          in: query
          required: false
          type: string
        - name: bridge_ids
          description: |-
